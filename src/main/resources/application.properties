spring.application.name=inovagab-backend

# ===== MongoDB =====
# Local: mongodb://localhost:27017/inovagab
# Atlas (nuvem, gratuito): mongodb+srv://<usuario>:<senha>@<cluster>.mongodb.net/inovagab
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/inovagab}

# ===== Servidor =====
server.port=${PORT:8080}

# ===== JWT =====
# Troque este segredo em produção. Pode vir de variável de ambiente JWT_SECRET.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== IA (Google Gemini - gratuito) =====
# Gere sua chave gratuita em https://aistudio.google.com/apikey
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# ===== Logs =====
logging.level.org.springframework.security=INFO
logging.level.br.com.fiap.inovagab=DEBUG

# Somente para laboratório; nunca ative seed com credenciais de demonstração em produção.
demo.seed.enabled=${DEMO_SEED_ENABLED:false}
demo.seed.password=${DEMO_SEED_PASSWORD:}
